name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (Web.Jotwai API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet format --verify-no-changes
      - run: dotnet test --no-build

      # Proves the API builds as its own deployable artifact (ADR-0007),
      # independent of the client build below.
      - run: docker build -t jotwai-backend:ci .

  client:
    name: Client (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Proves the SPA builds as its own static deployable artifact
      # (ADR-0007), independent of the backend build above.
      - run: docker build -t jotwai-client:ci .
