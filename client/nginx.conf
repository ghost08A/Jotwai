server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - react-router owns client-side routes (ADR-0007: the
    # backend never serves these, this static host does the routing instead).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
